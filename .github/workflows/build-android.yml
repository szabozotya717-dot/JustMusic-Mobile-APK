name: Build JustMusic Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            gettext \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            make \
            patch \
            pkg-config \
            python3-dev \
            python3-venv \
            sudo \
            unzip \
            wget \
            zip \
            zlib1g-dev

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          . "$HOME/.cargo/env"
          rustc --version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            git+https://github.com/kivy/buildozer \
            legacy-cgi \
            setuptools \
            wheel \
            cython==0.29.34
          buildozer --version

      - name: Prepare Android toolchain
        run: |
          . "$HOME/.cargo/env"
          buildozer android p4a -- --help

      - name: Build APK
        run: |
          . "$HOME/.cargo/env"
          buildozer -v android debug

      - name: Show generated files
        if: always()
        run: |
          find bin -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JustMusic-Android-APK
          path: bin/*.apk
          if-no-files-found: error
